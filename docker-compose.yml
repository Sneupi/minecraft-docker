services:

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: mc_tunnel_agent
    restart: unless-stopped
    pull_policy: always
    network_mode: host
    environment:
      - SECRET_KEY=${SECRET_KEY}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mc_server
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "26.3"
      MEMORY: "2G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
    volumes:
      - ./.minecraft/data:/data

  backup:
    image: itzg/mc-backup:latest
    container_name: mc_backup
    restart: unless-stopped
    environment:
      TZ: "UTC"
      PRUNE_BACKUPS_DAYS: 7
      CRON_SCHEDULE: "0 9 * * *"
      RCON_HOST: "minecraft"
      RCON_PASSWORD: "${RCON_PASSWORD}"
    volumes:
      - ./.minecraft/data:/data:ro
      - ./.minecraft/backups:/backups
    depends_on:
      - minecraft

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: mc_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --include-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"